<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>

    <link rel="stylesheet" href="css/variable.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <main class="todo-container">
      <header class="header">
        <div class="top-content">
          <h1>Todo App</h1>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <i data-lucide="sun"></i>
          </button>
        </div>
        <p>Manage tasks by status, date, category, and priority.</p>
      </header>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <!-- Add task form -->
      <form id="taskForm" class="task-form">
        <input
          id="taskInput"
          type="text"
          placeholder="Write your todo task"
          maxlength="120"
          required
        />

        <select id="priorityInput" aria-label="Select priority">
          <option value="Medium">Medium priority</option>
          <option value="Low">Low priority</option>
          <option value="High">High priority</option>
          <option value="Blocker">Blocker priority</option>
        </select>

        <select id="categoryInput" aria-label="Select category">
          <option value="study">Study</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
        </select>

        <input id="dueDateInput" type="date" aria-label="Select due date" />

        <button type="submit">Add Todo</button>
      </form>

      <!-- Filters and sorting -->
      <section class="filters" aria-label="Task filters">
        <input id="searchInput" type="search" placeholder="Search tasks" />

        <select id="statusFilter" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="not-started">Not Started</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>

        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="study">Study</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
        </select>

        <select id="priorityFilter" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="Blocker">Blocker</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <select id="sortBy" aria-label="Sort tasks">
          <option value="created-desc">Newest first</option>
          <option value="date-asc">Due date: nearest first</option>
          <option value="date-desc">Due date: latest first</option>
          <option value="priority-desc">Priority: highest first</option>
          <option value="priority-asc">Priority: lowest first</option>
        </select>

        <button id="clearCompletedButton" type="button">Clear Completed</button>
        <button id="deleteAllButton" type="button">Delete All</button>
      </section>

      <!-- Counters -->
      <section class="task-summary">
        <p>Completed: <strong id="completedCounter">0</strong></p>
        <p>Not completed: <strong id="notCompletedCounter">0</strong></p>
        <p>Completion: <strong id="completionPercentage">0%</strong></p>
      </section>

      <!-- Todo List -->
      <section class="todo-details">
        <h2>Todo List</h2>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
