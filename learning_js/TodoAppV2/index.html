<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="todo-container">
      <div class="header"><h1>TodoApp</h1></div>
      <div class="todo-form">
        <input
          id="taskInput"
          type="text"
          name="input-box"
          placeholder="Write your todo task"
        />
        <div class="buttons-list">
          <button class="add-todo">Add Todo</button>
          <button class="search-todo">Search Todo</button>
          <button class="clear-completed-tasks">Clear Completed Tasks</button>
        </div>
      </div>
      <div class="todo-details">
        <h2>Todo List</h2>
        <ul id="taskList"></ul>
        <hr />
      </div>

      <div class="counter-container">
        <div class="task-counter">
          Completed: <span id="completed-counter">0</span> | Not Completed:
          <span id="not-completed-counter">0</span>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
