<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="BMICalculator.css" />
  </head>
  <body>
    <header>
      <h1 class="main-heading">BMI Calculator</h1>
    </header>

    <main>
      <section class="input-section">
        <section class="weight-section">
          <label for="weight">Enter your Weight (kg):</label>
          <input type="number" id="weight" placeholder="e.g. 90" />
        </section>
        <section class="height-section">
          <label for="height">Enter your Height (cm):</label>
          <input type="number" id="height" placeholder="e.g. 210" />
        </section>
      </section>

      <section class="operation-section">
        <button class="calculate-btn">Calculate</button>
        <button class="clear-btn">Clear</button>
      </section>

      <section class="result-section">
        <p class="result"></p>
      </section>
    </main>

    <script src="BMICalculator.js"></script>
  </body>
</html>
