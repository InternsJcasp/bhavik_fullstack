<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="PalindromeChecker.css" />
  </head>
  <body>
    <header>
      <h1 class="main-heading">Palindrome Checker</h1>
    </header>

    <main>
      <section class="input-section">
        <section class="text-section">
          <label for="text-input">Enter Text or Number:</label>
          <input
            type="text"
            id="text-input"
            placeholder="e.g. racecar, Madam, 121"
          />
        </section>
      </section>

      <section class="operation-section">
        <button class="calculate-btn">Check</button>
        <button class="clear-btn">Clear</button>
      </section>

      <section class="result-section">
        <p class="result"></p>
      </section>
    </main>

    <script src="PalindromeChecker.js"></script>
  </body>
</html>
