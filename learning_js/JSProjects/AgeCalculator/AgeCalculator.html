<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="AgeCalculator.css" />
  </head>
  <body>
    <header>
      <h1 class="main-heading">Age Calculator</h1>
    </header>

    <main>
      <section class="input-section">
        <section class="date-of-birth-section">
          <label for="dob">Enter your Date of Birth</label>
          <input type="date" id="dob" />
        </section>
        <section class="current-date-section">
          <label for="current-date">Enter Current Date:</label>
          <input type="date" id="current-date" />
        </section>
      </section>

      <section class="operation-section">
        <button class="calculate-btn">Calculate</button>
        <button class="clear-btn">Clear</button>
      </section>

      <section class="result-section">
        <p class="result"></p>
      </section>
    </main>
    <script src="AgeCalculator.js"></script>
  </body>
</html>
