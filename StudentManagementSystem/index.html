<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/component.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <h1>🎓 Student Management System</h1>
        <p class="subtitle">Manage students, track performance, analyze data</p>
      </div>
    </header>

    <main class="main-container">
      <!-- Statistics Section -->
      <section class="stats-section" aria-label="Student Statistics">
        <h2 class="section-title">Dashboard</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-icon">👥</span>
            <div class="stat-info">
              <h3>Total Students</h3>
              <p id="total-students" class="stat-value">0</p>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">📊</span>
            <div class="stat-info">
              <h3>Total Marks</h3>
              <p id="total-marks" class="stat-value">0</p>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">📈</span>
            <div class="stat-info">
              <h3>Average Marks</h3>
              <p id="average-marks" class="stat-value">0</p>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">🏆</span>
            <div class="stat-info">
              <h3>Highest Marks</h3>
              <p id="highest-marks" class="stat-value">0</p>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">📉</span>
            <div class="stat-info">
              <h3>Lowest Marks</h3>
              <p id="lowest-marks" class="stat-value">0</p>
            </div>
          </div>
        </div>

        <!-- Course-wise Statistics -->
        <div class="course-stats-section">
          <h3>Course-wise Statistics</h3>
          <div id="course-stats-grid" class="course-stats-grid">
            <!-- Dynamically populated by JS -->
            <!-- Example:
          <div class="course-stat-card">
            <h4>JavaScript</h4>
            <p>Students: <span class="course-count">2</span></p>
            <p>Total Marks: <span class="course-total">177</span></p>
            <p>Average: <span class="course-average">88.5</span></p>
          </div> 
          --></div>
        </div>
      </section>
    </main>
  </body>
</html>
